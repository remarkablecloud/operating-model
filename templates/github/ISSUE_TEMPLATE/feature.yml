name: Feature
description: Something new for customers
labels: ["feature"]
projects: ["{{OWNER}}/{{BOARD_NUMBER}}"]
body:
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: "Blocked by (cannot start until these are done), Depends on (can be built in parallel, cannot ship before these), Blocks. Card numbers, or none. The architect also sets GitHub's own issue dependencies."
      value: |
        Blocked by: none
        Depends on: none
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: Estimate
      description: "Session hours for one Coder (the architect sets it if left blank)."
  - type: textarea
    id: what
    attributes:
      label: What it does
      description: In plain words, from the customer's side.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: Who asked for it, what it saves or earns, what it unblocks.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Decisions, links, related decisions (D numbers).
