name: Task
description: Operations, research, content or a decision
labels: ["task"]
projects: ["{{OWNER}}/{{BOARD_NUMBER}}"]
body:
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: "Blocked by (cannot start until these are done), Depends on (can be built in parallel, cannot ship before these), Blocks. Card numbers, or none. The architect also sets GitHub's own issue dependencies."
      value: |
        Blocked by: none
        Depends on: none
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: Estimate
      description: "Session hours for one Coder (the architect sets it if left blank)."
  - type: textarea
    id: what
    attributes:
      label: What needs doing
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we know it is finished.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Decisions, links, related ids.
